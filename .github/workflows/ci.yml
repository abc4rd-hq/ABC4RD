name: Platform checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Academy Core
        working-directory: academy-core
        run: python -m unittest discover -s tests -v
      - name: Test Digital Twin
        run: python -m unittest discover -s digital-twin/tests -v
      - name: Test learner portal
        run: |
          python -m pip install -r deployment/portal/requirements.txt
          PYTHONPATH=deployment/portal python -m unittest discover -s deployment/portal/tests -v
      - name: Check Keycloak automation
        run: bash -n deployment/keycloak/configure-passkeys.sh deployment/keycloak/configure-portal-clients.sh
      - name: Check backup automation
        run: bash -n deployment/backup/create-runtime-backup.sh deployment/backup/check-runtime-restore.sh
      - name: Check monitoring automation
        run: bash -n deployment/monitoring/abc4rd-platform-health.sh
      - name: Compile Tutor plugin
        run: python -m py_compile deployment/openedx/tutor-plugins/abc4rd.py
      - name: Check ERPNext deployment
        working-directory: deployment/erpnext
        run: ./scripts/check-static.sh
