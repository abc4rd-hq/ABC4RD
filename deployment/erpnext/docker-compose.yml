name: ${ERPNEXT_PROJECT_NAME:-abc4rd-erpnext}

x-erpnext-image: &erpnext-image
  image: ${ABC4RD_ERPNEXT_IMAGE:-abc4rd/erpnext-crm:v16.30.0-abc4rd.1}
  build:
    context: .
    dockerfile: Containerfile
    args:
      ERPNEXT_BASE_IMAGE: ${ERPNEXT_BASE_IMAGE:-frappe/erpnext:v16.30.0@sha256:5349ec895be64617d1b0060d6dde0740592fa65eca266f8eb5e26bd3e73e2126}
  pull_policy: never
  platform: linux/amd64
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-configured-service: &configured-service
  <<: *erpnext-image
  depends_on:
    configurator:
      condition: service_completed_successfully
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  networks:
    - internal

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4}
    platform: linux/amd64
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets:
      - db_root_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true

  redis-cache:
    image: ${REDIS_IMAGE:-redis:8.6-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9}
    platform: linux/amd64
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  redis-queue:
    image: ${REDIS_IMAGE:-redis:8.6-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9}
    platform: linux/amd64
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  configurator:
    <<: *erpnext-image
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - >-
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - internal
    mem_limit: 512m
    cpus: 0.5

  backend:
    <<: *configured-service
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    networks:
      - internal
      - egress
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Host: ${SITE_NAME:-crm.abc4rd.org}'
          http://127.0.0.1:8000/api/method/ping >/dev/null
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 1536m
    cpus: 1.5

  frontend:
    <<: *erpnext-image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-crm.abc4rd.org}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-25m}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_started
    networks:
      internal:
      tutor:
        aliases:
          - abc4rd-erpnext-frontend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Host: ${SITE_NAME:-crm.abc4rd.org}'
          http://127.0.0.1:8080/api/method/ping >/dev/null
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5

  websocket:
    <<: *configured-service
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    mem_limit: 512m
    cpus: 0.5

  queue-short:
    <<: *configured-service
    command: ["bench", "worker", "--queue", "short,default"]
    networks:
      - internal
      - egress
    mem_limit: 1g
    cpus: 1.0

  queue-long:
    <<: *configured-service
    command: ["bench", "worker", "--queue", "long,default,short"]
    networks:
      - internal
      - egress
    mem_limit: 1536m
    cpus: 1.0

  scheduler:
    <<: *configured-service
    command: ["bench", "schedule"]
    networks:
      - internal
      - egress
    mem_limit: 512m
    cpus: 0.5

  site-bootstrap:
    <<: *configured-service
    profiles: ["bootstrap"]
    restart: "no"
    entrypoint: ["/usr/local/bin/abc4rd-bootstrap-site"]
    environment:
      SITE_NAME: ${SITE_NAME:-crm.abc4rd.org}
    secrets:
      - db_root_password
      - administrator_password
    networks:
      - internal
      - egress
    mem_limit: 1536m
    cpus: 1.0

volumes:
  sites:
    name: ${ERPNEXT_RESOURCE_PREFIX:-abc4rd-erpnext}-sites
  db-data:
    name: ${ERPNEXT_RESOURCE_PREFIX:-abc4rd-erpnext}-db-data
  redis-queue-data:
    name: ${ERPNEXT_RESOURCE_PREFIX:-abc4rd-erpnext}-redis-queue-data

networks:
  internal:
    name: ${ERPNEXT_RESOURCE_PREFIX:-abc4rd-erpnext}-internal
    internal: true
  egress:
    name: ${ERPNEXT_RESOURCE_PREFIX:-abc4rd-erpnext}-egress
  tutor:
    external: true
    name: ${TUTOR_NETWORK:-tutor_local_default}

secrets:
  db_root_password:
    file: ${DB_ROOT_PASSWORD_FILE:-/opt/abc4rd/secrets/erpnext-db-root-password}
  administrator_password:
    file: ${ERPNEXT_ADMIN_PASSWORD_FILE:-/opt/abc4rd/secrets/erpnext-administrator-password}
