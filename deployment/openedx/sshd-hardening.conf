# ABC4RD production SSH policy.
# Installed as /etc/ssh/sshd_config.d/00-abc4rd-hardening.conf so these values
# are read before cloud-image defaults (OpenSSH keeps the first value found).

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowUsers ubuntu
